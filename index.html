<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArcGIS グラフ連動</title>

  <!-- ArcGIS -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.29/"　defer></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"　defer></script>

  <style>
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    canvas { width: 400px !important; height: 300px !important; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>

<body>

<h2>ArcGISデータ → グラフ</h2>

<div class="container">
  <canvas id="barChart"></canvas>
  <canvas id="lineChart"></canvas>
  <canvas id="pieChart"></canvas>
</div>

<h3>データ表</h3>
<table id="dataTable">
  <thead>
    <tr><th>名称</th><th>値</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
require([
  "esri/layers/FeatureLayer"
], function(FeatureLayer) {

  const layer = new FeatureLayer({
    url: "https://services9.arcgis.com/YtkgVT3n52Tm7z1d/arcgis/rest/services/waterStationTable/FeatureServer/0"
  });

  let charts = [];

  layer.queryFeatures({
    where: "1=1",
    outFields: ["*"],
    returnGeometry: false
  }).then(res => {

    // ===== 合計（複数レコード対応）=====
    let total稼働数 = 0;
    let total稼働可能数 = 0;
    let total給水 = 0;

    res.features.forEach(f => {
      total稼働数 += f.attributes["稼働数"];
      total稼働可能数 += f.attributes["稼働可能数"];
      total給水 += f.attributes["災害時給水ステーション数"];
    });

    // 稼働率（再計算の方が安全）
    const 稼働率 = total稼働可能数 === 0
      ? 0
      : (total稼働数 / total稼働可能数 * 100).toFixed(1);

    // ===== グラフ用データ =====
    const chartData = [
      { name: "稼働数", value: total稼働数 },
      { name: "稼働可能数", value: total稼働可能数 },
      { name: "給水ステーション", value: total給水 }
    ];

    updateAll(chartData, 稼働率);
  });

  function updateAll(chartData, rate) {

    const labels = chartData.map(d => d.name);
    const values = chartData.map(d => d.value);

    charts.forEach(c => c.destroy());
    charts = [];

    charts.push(createChart('barChart', 'bar', labels, values));
    charts.push(createChart('lineChart', 'line', labels, values));
    charts.push(createChart('pieChart', 'pie', labels, values));

    // ===== 表 =====
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';

    chartData.forEach(d => {
      tbody.innerHTML += `<tr><td>${d.name}</td><td>${d.value}</td></tr>`;
    });

    // 稼働率追加
    tbody.innerHTML += `<tr><td>稼働率</td><td>${rate}%</td></tr>`;
  }

  function createChart(id, type, labels, values) {
    return new Chart(document.getElementById(id), {
      type: type,
      data: {
        labels: labels,
        datasets: [{
          data: values
        }]
      }
    });
  }
});

</script>
</body>
</html>
