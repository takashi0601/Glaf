<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <!-- Chart.js（deferあり） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>

  <!-- ArcGIS（deferなし） -->
  <script src="https://js.arcgis.com/4.29/"></script>

  
</head>

<body>

<canvas id="barChart"></canvas>
<canvas id="lineChart"></canvas>
<canvas id="pieChart"></canvas>

<table id="dataTable">
  <tbody></tbody>
</table>

<script>
require(["esri/layers/FeatureLayer"], function(FeatureLayer) {

  // ★必ず /0
  const layer = new FeatureLayer({
    url: "https://services9.arcgis.com/YtkgVT3n52Tm7z1d/arcgis/rest/services/waterStationTable/FeatureServer/0"
  });

  let charts = [];

  layer.queryFeatures({
    where: "1=1",
    outFields: ["*"],
    returnGeometry: false
  }).then(res => {

    let total稼働数 = 0;
    let total稼働可能数 = 0;
    let total給水 = 0;

    res.features.forEach(f => {
      total稼働数 += Number(f.attributes["稼働数"]) || 0;
      total稼働可能数 += Number(f.attributes["稼働可能数"]) || 0;
      total給水 += Number(f.attributes["災害時給水ステーション数"]) || 0;
    });

    const 稼働率 = total稼働可能数 === 0
      ? 0
      : (total稼働数 / total稼働可能数 * 100).toFixed(1);

    const labels = ["稼働数", "稼働可能数", "給水ステーション"];
    const values = [total稼働数, total稼働可能数, total給水];

    createChart('barChart', 'bar', labels, values);
    createChart('lineChart', 'line', labels, values);
    createChart('pieChart', 'pie', labels, values);

    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = `
      <tr><td>稼働数</td><td>${total稼働数}</td></tr>
      <tr><td>稼働可能数</td><td>${total稼働可能数}</td></tr>
      <tr><td>給水ステーション</td><td>${total給水}</td></tr>
      <tr><td>稼働率</td><td>${稼働率}%</td></tr>
    `;
  });

  function createChart(id, type, labels, values) {
    const el = document.getElementById(id);
    if (!el) {
      console.error(id + " が見つからない");
      return;
    }

    new Chart(el, {
      type: type,
      data: {
        labels: labels,
        datasets: [{
          data: values
        }]
      }
    });
  }

});
</script>

</body>
</html>
