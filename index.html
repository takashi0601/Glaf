<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>共通データグラフ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .container { display: flex; flex-wrap: wrap; gap: 20px; }
    canvas { width: 400px !important; height: 300px !important; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>

<h2>共通データグラフ</h2>

<div class="container">
  <canvas id="barChart"></canvas>
  <canvas id="lineChart"></canvas>
  <canvas id="pieChart"></canvas>
</div>

<h3>データ表</h3>
<table id="dataTable">
  <thead>
    <tr>
      <th>項目</th>
      <th>値</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  // ★ ここだけ変更すれば全部に反映
  const chartData = [
    { name: 'A', value: 12 },
    { name: 'B', value: 19 },
    { name: 'C', value: 3 },
    { name: 'D', value: 5 }
  ];

  // 共通変換
  const labels = chartData.map(d => d.name);
  const values = chartData.map(d => d.value);

  // ===== グラフ =====
  function createChart(id, type) {
    return new Chart(document.getElementById(id), {
      type: type,
      data: {
        labels: labels,
        datasets: [{
          label: type + 'グラフ',
          data: values,
          fill: false
        }]
      }
    });
  }

  createChart('barChart', 'bar');
  createChart('lineChart', 'line');
  createChart('pieChart', 'pie');

  // ===== 表 =====
  function renderTable() {
    const tbody = document.querySelector('#dataTable tbody');
    tbody.innerHTML = '';

    chartData.forEach(d => {
      const row = `<tr><td>${d.name}</td><td>${d.value}</td></tr>`;
      tbody.innerHTML += row;
    });
  }

  renderTable();

</script>

</body>
</html>
